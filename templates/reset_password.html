<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reset password — Exclusive Barber Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=164" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <img
            class="brand-logo"
            src="/static/img/logo.png?v=2"
            alt="Exclusive Barber Studio"
            width="200"
            height="54"
            style="margin: 0 auto 0.65rem; height: 3.25rem; max-width: 12rem"
          />
          <h1 class="login-title">Exclusive Barber Studio</h1>
          <p class="login-lead" data-i18n="reset.lead">Choose a new password.</p>
        </div>
        <form id="reset-form" class="login-form">
          <input type="hidden" id="reset-token" value="{{ token | e }}" />
          <label>
            <span data-i18n="reset.newPassword">New password</span>
            <input type="password" id="reset-password" required minlength="6" maxlength="200" autocomplete="new-password" />
          </label>
          <label>
            <span data-i18n="reset.confirmPassword">Confirm password</span>
            <input type="password" id="reset-confirm" required minlength="6" maxlength="200" autocomplete="new-password" />
          </label>
          <p class="login-error" id="reset-error" hidden role="alert"></p>
          <p class="login-ok" id="reset-ok" hidden role="status"></p>
          <button type="submit" class="cta login-submit" data-i18n="reset.submit">Update password</button>
          <a class="chip login-forgot-btn" href="/login" data-i18n="login.backToSignIn">Back to sign in</a>
        </form>
      </div>
    </main>
    <script>
      (function () {
        var I18N = {
          en: {
            "reset.lead": "Choose a new password.",
            "reset.newPassword": "New password",
            "reset.confirmPassword": "Confirm password",
            "reset.submit": "Update password",
            "reset.mismatch": "Passwords do not match.",
            "reset.short": "Password must be at least 6 characters.",
            "reset.invalid": "This reset link is invalid or has expired.",
            "reset.done": "Password updated. You can sign in now.",
            "login.backToSignIn": "Back to sign in",
          },
          es: {
            "reset.lead": "Elija una nueva contraseña.",
            "reset.newPassword": "Nueva contraseña",
            "reset.confirmPassword": "Confirmar contraseña",
            "reset.submit": "Actualizar contraseña",
            "reset.mismatch": "Las contraseñas no coinciden.",
            "reset.short": "La contraseña debe tener al menos 6 caracteres.",
            "reset.invalid": "Este enlace no es válido o ha expirado.",
            "reset.done": "Contraseña actualizada. Ya puede iniciar sesión.",
            "login.backToSignIn": "Volver a iniciar sesión",
          },
        };
        function lang() {
          try {
            var prefs = JSON.parse(localStorage.getItem("repairDesk.prefs.v1") || "{}");
            return prefs.language === "es" ? "es" : "en";
          } catch (e) {
            return "en";
          }
        }
        function t(key) {
          var L = lang();
          return (I18N[L] && I18N[L][key]) || I18N.en[key] || key;
        }
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.documentElement.lang = lang();
        document.getElementById("reset-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          var err = document.getElementById("reset-error");
          var ok = document.getElementById("reset-ok");
          err.hidden = true;
          ok.hidden = true;
          var token = document.getElementById("reset-token").value.trim();
          var pw = document.getElementById("reset-password").value;
          var confirm = document.getElementById("reset-confirm").value;
          if (pw.length < 6) {
            err.textContent = t("reset.short");
            err.hidden = false;
            return;
          }
          if (pw !== confirm) {
            err.textContent = t("reset.mismatch");
            err.hidden = false;
            return;
          }
          if (!token) {
            err.textContent = t("reset.invalid");
            err.hidden = false;
            return;
          }
          try {
            var res = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ token: token, new_password: pw }),
            });
            var body = {};
            try { body = await res.json(); } catch (_) {}
            if (!res.ok) {
              err.textContent = body.detail || t("reset.invalid");
              err.hidden = false;
              return;
            }
            ok.textContent = t("reset.done");
            ok.hidden = false;
            setTimeout(function () { window.location.href = "/login"; }, 1400);
          } catch (_) {
            err.textContent = t("reset.invalid");
            err.hidden = false;
          }
        });
      })();
    </script>
  </body>
</html>
